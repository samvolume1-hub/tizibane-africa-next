name: TIZIBANE Android signed release build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tizibane-android-signed-release
  cancel-in-progress: false

jobs:
  build-signed-android:
    name: Build signed TIZIBANE APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret."; exit 1; }

      - name: Verify hosted PWA foundations
        run: node scripts/check-pwa-readiness.mjs

      - name: Restore private Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/tizibane-release.keystore
          chmod 600 android/tizibane-release.keystore
          test -s android/tizibane-release.keystore

      - name: Generate Android project from approved TWA identity
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            update --skipVersionUpgrade \
            --directory=/workspace/android \
            --manifest=/workspace/android/twa-manifest.json

      - name: Build signed APK and Android App Bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/android \
            --env BUBBLEWRAP_KEYSTORE_PASSWORD \
            --env BUBBLEWRAP_KEY_PASSWORD \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build --skipPwaValidation \
            --directory=/workspace/android \
            --manifest=/workspace/android/twa-manifest.json \
            --signingKeyPath=/workspace/android/tizibane-release.keystore \
            --signingKeyAlias=tizibane

      - name: Verify signed release artifacts exist
        run: |
          set -euo pipefail
          test -s android/app-release-signed.apk
          test -s android/app-release-bundle.aab
          sudo chmod a+r android/app-release-signed.apk android/app-release-bundle.aab

      - name: Upload signed Android release candidates
        uses: actions/upload-artifact@v4
        with:
          name: tizibane-android-signed-release-candidate
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30
