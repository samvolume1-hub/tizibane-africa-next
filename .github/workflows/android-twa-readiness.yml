name: TIZIBANE Android TWA readiness

on:
  push:
    branches:
      - build/three-platform-installation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tizibane-android-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pwa:
    name: Validate hosted PWA for Android packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate TIZIBANE's live PWA against TWA quality criteria
        run: npx --yes @bubblewrap/cli validate --url=https://tizibane-africa-next.onrender.com
