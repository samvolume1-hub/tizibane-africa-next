name: TIZIBANE Android TWA readiness

on:
  push:
    branches:
      - build/three-platform-installation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tizibane-android-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pwa:
    name: Validate hosted PWA for Android packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate TIZIBANE's live PWA against TWA quality criteria
        run: docker run --rm ghcr.io/googlechromelabs/bubblewrap:latest validate --url=https://tizibane-africa-next.onrender.com
