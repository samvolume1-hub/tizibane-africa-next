<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24112f">
  <meta name="color-scheme" content="dark">
  <title>You're offline — TIZIBANE Zambia</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #160d20;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% 0%, #49305b 0%, #24112f 42%, #160d20 100%);
    }
    main {
      width: min(100%, 440px);
      padding: clamp(26px, 7vw, 42px);
      border: 1px solid rgba(235, 190, 246, .3);
      border-radius: 26px;
      background: rgba(25, 15, 35, .84);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .34);
      text-align: center;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
      border: 2px solid #d8a9e7;
      border-radius: 21px;
      color: #fff;
      font-size: 42px;
      font-weight: 850;
      line-height: 1;
      box-shadow: inset 0 0 0 5px rgba(216, 169, 231, .1);
    }
    .eyebrow {
      color: #d8b6e8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 12px;
      font-size: clamp(27px, 6vw, 36px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }
    p {
      margin: 0;
      color: rgba(255, 255, 255, .8);
      font-size: 15px;
      line-height: 1.7;
    }
    .privacy {
      margin-top: 15px;
      color: #e5d4ec;
      font-size: 12px;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin-top: 25px;
      padding: 0 24px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 999px;
      background: #76508e;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">T</div>
    <div class="eyebrow">TIZIBANE Zambia</div>
    <h1>You're offline.</h1>
    <p>TIZIBANE can't reach your community right now. Check your internet connection, then try again to continue.</p>
    <p class="privacy">For your privacy, conversations, profiles and other member information are not saved as offline copies on this device.</p>
    <a href="/home">Try again</a>
  </main>
</body>
</html>
